<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>2026 한우물제</title>
<meta name="description" content="금정중학교 한우물제 공연 식순, 관람 안전, 서울랜드 지도, 집결·귀가 안내">
<meta property="og:title" content="2026 한우물제 · 금정중학교">
<meta property="og:description" content="10월 28일 서울랜드 이벤트홀 · 식순과 안전·집결 안내">
<meta property="og:image" content="emblem.png">
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="icon" href="emblem.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<!-- 글꼴은 휴대폰 기본 글꼴만 써요 (내려받는 글꼴 없음 → 첫 화면이 빨라요) -->
<style>
/* 인스타그램 라이트 스타일: 흰 캔버스, 회색 선, 핑크 포인트, 파란 버튼. 교표는 스토리 링, 탭은 아래 고정 */
:root{
  --bg:#FFFFFF; --subtle:#FAFAFA; --fill:#EFEFEF; --line:#DBDBDB; --ink:#262626; --muted:#737373;
  --accent:#E1306C; --accent-soft:#FCE4F0; --action:#0095F6; --action-ink:#FFFFFF; --link:#00376B;
  --danger:#ED4956; --danger-ink:#C9303D; --danger-soft:#FCE4E4; --ok:#00A651;
  --ig1:#FED373; --ig2:#F15245; --ig3:#D92E7F; --ig4:#9B36B7; --ig5:#515ECF;
  --c-perf:#C13584; --c-perf-bg:#FCE4F0; --c-video:#4655C4; --c-video-bg:#E8EAFB; --c-cer:#595959; --c-cer-bg:#EFEFEF;
  --k-stage:#833AB4; --k-meet:#E1306C; --k-aid:#0A8A43; --k-info:#0074CC; --k-teacher:#262626; --k-etc:#737373;
  --pin-ring:#FFFFFF; --on-color:#FFFFFF; --emblem-bg:#FFFFFF; --label-bg:#262626; --map-bg:#E3F1FA; --shadow:0 4px 12px rgba(0,0,0,.10);
  --f-body:-apple-system,BlinkMacSystemFont,"Pretendard","Apple SD Gothic Neo","Segoe UI","Malgun Gothic","Noto Sans KR",sans-serif;
  --f-mono:ui-monospace,"SF Mono",Menlo,Consolas,"Roboto Mono",monospace;
  --nav-h:62px; color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#000000; --subtle:#121212; --fill:#262626; --line:#2E2E2E; --ink:#FAFAFA; --muted:#A8A8A8;
  --accent:#F0457F; --accent-soft:#3A1022; --link:#E0F1FF; --danger:#FF6B76; --danger-ink:#FF8A93; --danger-soft:#3A1517; --ok:#3DDC84;
  --c-perf:#F27AB5; --c-perf-bg:#3A1022; --c-video:#9AA6FF; --c-video-bg:#1E2147; --c-cer:#C7C7C7; --c-cer-bg:#262626;
  --k-teacher:#424242; --shadow:0 4px 12px rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#000000; --subtle:#121212; --fill:#262626; --line:#2E2E2E; --ink:#FAFAFA; --muted:#A8A8A8;
  --accent:#F0457F; --accent-soft:#3A1022; --link:#E0F1FF; --danger:#FF6B76; --danger-ink:#FF8A93; --danger-soft:#3A1517; --ok:#3DDC84;
  --c-perf:#F27AB5; --c-perf-bg:#3A1022; --c-video:#9AA6FF; --c-video-bg:#1E2147; --c-cer:#C7C7C7; --c-cer-bg:#262626;
  --k-teacher:#424242; --shadow:0 4px 12px rgba(0,0,0,.6); color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6;-webkit-text-size-adjust:100%}
img{max-width:100%}
[hidden]{display:none!important}
.wrap{max-width:760px;margin:0 auto;padding:0 16px calc(var(--nav-h) + 32px + env(safe-area-inset-bottom,0px));display:grid;gap:20px}
.wrap.plain{padding-top:calc(16px + env(safe-area-inset-top,0px));padding-bottom:0}
h1,h2,h3{text-wrap:balance;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--action);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* 위쪽 바 + 메인 히어로 */
.topbar{position:sticky;top:0;z-index:5;background:var(--bg);margin-inline:-16px;padding:calc(8px + env(safe-area-inset-top,0px)) 16px 8px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line)}
.topbar img{width:30px;height:30px;border-radius:50%;background:var(--emblem-bg);padding:2px;border:1px solid var(--line);flex:none}
.topbar b{font-size:16px;font-weight:700;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .sp{flex:1}
.hero{display:grid;justify-items:center;text-align:center;gap:8px;padding:18px 0 2px}
.ring{width:112px;height:112px;border-radius:50%;padding:4px;background:linear-gradient(45deg,var(--ig1),var(--ig2) 35%,var(--ig3) 62%,var(--ig4) 82%,var(--ig5))}
.ring img{display:block;width:100%;height:100%;border-radius:50%;border:4px solid var(--bg);background:var(--emblem-bg);padding:5px}
.eyebrow{margin:6px 0 0;font-size:15px;font-weight:700;color:var(--muted);letter-spacing:.06em}
.hero h1{font-size:clamp(34px,10vw,44px);line-height:1.1;font-weight:800;letter-spacing:-.03em}
.hero h1 span{background:linear-gradient(45deg,var(--ig2),var(--ig3) 50%,var(--ig4));-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
.pills{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.pill{background:var(--fill);border-radius:9999px;padding:5px 14px;font-size:15px;font-weight:600}
.status{display:flex;align-items:center;gap:10px;background:var(--subtle);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:16px;font-weight:600}
.status .tag{flex:none}
.tag{display:inline-flex;align-items:center;padding:2px 12px;border-radius:9999px;font-size:14px;font-weight:700;line-height:22px;background:var(--accent);color:var(--on-color)}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fact{all:unset;box-sizing:border-box;border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;gap:2px;align-content:start;min-width:0}
button.fact{cursor:pointer}
.fact small{font-size:14px;color:var(--muted);font-weight:600}
.fact b{font-size:24px;line-height:1.2;font-weight:800;letter-spacing:-.01em}
.fact b.txt{font-size:18px;line-height:1.3}
.fact em{font-style:normal;font-size:13px;color:var(--action);font-weight:700}

/* 공지 (화면 전체) + 공지 띠 */
.ann{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.74);display:grid;place-items:center;padding:20px;cursor:pointer;-webkit-tap-highlight-color:transparent;overflow:auto}
.ann-card{width:100%;max-width:520px;background:var(--bg);color:var(--ink);border-radius:20px;padding:28px 22px 22px;display:grid;gap:16px;justify-items:center;text-align:center;box-shadow:0 16px 32px rgba(225,48,108,.25)}
.ann-text{margin:0;font-size:clamp(26px,7.5vw,36px);line-height:1.35;font-weight:800;word-break:keep-all;white-space:pre-wrap;overflow-wrap:anywhere}
.ann-hint{font-size:15px;color:var(--muted);font-weight:600}
.ann-time{font-size:14px;color:var(--muted)}
.annbar{all:unset;box-sizing:border-box;display:flex;gap:10px;align-items:center;width:100%;background:var(--accent-soft);color:var(--ink);border-radius:12px;padding:10px 14px;font-size:16px;font-weight:700;cursor:pointer}
.presets{display:grid;gap:6px}
.presets .btn{white-space:normal;height:auto;min-height:36px;padding:8px 12px;text-align:left;justify-content:flex-start;line-height:1.4}
.annbar span:last-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (prefers-reduced-motion:no-preference){.ann-card{animation:pop .25s cubic-bezier(.34,1.56,.64,1)}@keyframes pop{from{transform:scale(.92);opacity:0}}}
@media (max-width:400px){.ring{width:96px;height:96px}}
/* 아래 고정 탭 (인스타그램 앱 하단 바) */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--bg);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav div{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tab{border:0;background:none;height:var(--nav-h);display:grid;place-items:center;align-content:center;gap:3px;cursor:pointer;color:var(--muted);font-size:12px;font-weight:600;padding:0 2px;white-space:nowrap}
.tab svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-selected="true"]{color:var(--ink)}
.tab[aria-selected="true"] svg{stroke-width:2.6}

.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;font-size:14px;color:var(--muted)}
.btn{border:0;background:var(--fill);color:var(--ink);border-radius:8px;height:40px;padding:0 18px;font-weight:600;font-size:15px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.btn.primary{background:var(--action);color:var(--action-ink)}
.btn.small{height:34px;padding:0 14px;font-size:14px}
.btn:disabled{opacity:.4;cursor:default}

section.view{display:grid;gap:16px}
.sec-h{display:grid;gap:2px}
.sec-h h2{font-size:22px;font-weight:800;letter-spacing:-.01em}
.sec-h p{margin:0;color:var(--muted);font-size:15px}

.filters{display:flex;gap:8px;flex-wrap:wrap}
.chipbtn{border:0;background:var(--fill);border-radius:8px;height:36px;padding:0 16px;font-size:15px;font-weight:600;cursor:pointer;color:var(--ink)}
.chipbtn[aria-pressed="true"]{background:var(--ink);color:var(--bg)}

/* 식순: 스토리 링 번호 + 제목 (공연은 컬러 링, 나머지는 회색 링) */
.prog{list-style:none;margin:0;padding:0;display:grid}
.row{display:grid;grid-template-columns:44px 1fr;gap:12px;align-items:center;padding:8px 0}
.no{width:44px;height:44px;border-radius:50%;padding:2px;background:var(--line);display:grid}
.no.perf{background:linear-gradient(45deg,var(--ig1),var(--ig2) 35%,var(--ig3) 62%,var(--ig4) 82%,var(--ig5))}
.no span{border-radius:50%;border:2px solid var(--bg);background:var(--subtle);display:grid;place-items:center;font:700 15px/1 var(--f-mono)}
.row .body{min-width:0;display:grid;gap:3px;justify-items:start}
.row .title{font-weight:600;font-size:17px;line-height:1.4}
.chip{display:inline-block;font-size:13px;font-weight:700;border-radius:9999px;padding:1px 9px;line-height:18px}
.chip.cer{color:var(--c-cer);background:var(--c-cer-bg)}.chip.perf{color:var(--c-perf);background:var(--c-perf-bg)}.chip.video{color:var(--c-video);background:var(--c-video-bg)}

.card{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:16px;display:grid;gap:10px}
.card h3{font-size:18px;font-weight:700}
.rules{margin:0;padding-left:20px;display:grid;gap:6px}
.steps{margin:0;padding:0;list-style:none;counter-reset:s;display:grid;gap:10px}
.steps li{counter-increment:s;display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start}
.steps li::before{content:counter(s);font:700 14px/1 var(--f-mono);width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--danger-soft);color:var(--danger-ink)}
.evac{border-color:var(--danger)}
.evac h3{color:var(--danger-ink)}
.callout{font-size:15px;background:var(--subtle);border:1px solid var(--line);border-radius:8px;padding:8px 12px;margin:0}

.meet{border:1px solid var(--line);border-radius:12px;padding:16px;display:grid;grid-template-columns:auto 1fr auto;gap:6px 16px;align-items:center;box-shadow:var(--shadow)}
.meet .clock{font-size:40px;line-height:1;font-weight:700;letter-spacing:-.02em}
.meet .info{min-width:0;display:grid;gap:4px;justify-items:start}
.meet .info b{font-size:16px}
.meet .info span{color:var(--muted);font-size:14px}
@media (max-width:480px){.meet{grid-template-columns:1fr}}

.tl{list-style:none;margin:0;padding:0;display:grid}
.tl li{display:grid;grid-template-columns:62px 14px 1fr;gap:10px;align-items:start;padding-bottom:14px;position:relative}
.tl li:last-child{padding-bottom:0}
.tl .t{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:14px;text-align:right;padding-top:1px}
.tl .dot{width:12px;height:12px;border-radius:50%;border:2px solid var(--accent);background:var(--bg);margin-top:5px;position:relative;z-index:1}
.tl li:not(:last-child)::after{content:"";position:absolute;left:77px;top:18px;bottom:0;width:2px;background:var(--line)}
.tl li.done .dot{background:var(--accent)}
.tl li.on .dot{background:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.tl .d{min-width:0}.tl .d small{display:block;color:var(--muted);font-size:13px}

.check{display:grid;gap:10px}
.check label{display:flex;gap:10px;align-items:center;cursor:pointer}
.check input{width:22px;height:22px;accent-color:var(--accent);flex:none}

.sit{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.sit .card{gap:6px}
.sit p{margin:0;font-size:15px}
.list{display:grid;border:1px solid var(--line);border-radius:8px;overflow:hidden;list-style:none;margin:0;padding:0}
.ct{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:12px 16px;border-top:1px solid var(--line);align-items:center}
.ct:first-child{border-top:0}
.ct .who{min-width:0;font-weight:600}.ct .who small{display:block;color:var(--muted);font-size:13px;font-weight:400}
.ct .num{font-family:var(--f-mono);font-size:15px;color:var(--link);font-weight:600;user-select:all}
.ct .empty{color:var(--muted);font-size:13px}
.ct.urgent .num{color:var(--danger-ink);font-size:20px}

/* 지도: 처음엔 화면 높이에 꽉 차게 확대, 두 손가락으로 확대·축소, 전체 화면 가능 */
.mapbar{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.mapbar .sp{flex:1}
.mapwrap{display:grid;gap:8px}
.mapbox{overflow:auto;border:1px solid var(--line);border-radius:8px;background:var(--map-bg);max-height:max(300px,calc(100vh - 190px));max-height:max(300px,calc(100dvh - 190px));-webkit-overflow-scrolling:touch;touch-action:pan-x pan-y;overscroll-behavior:contain;cursor:grab}
.mapbox.dragging{cursor:grabbing}
.mapinner{position:relative;width:calc(100% * var(--z,1))}
.mapinner img{display:block;width:100%;max-width:none;height:auto;user-select:none;-webkit-user-drag:none;-webkit-touch-callout:none}
.mapinner.placing{cursor:crosshair}
.mapwrap.full{position:fixed;inset:0;z-index:30;background:var(--bg);display:flex;flex-direction:column;gap:0;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
.mapwrap.full .mapbar{padding:8px 12px}
.mapwrap.full .mapbox{flex:1;min-height:0;max-height:none;border-radius:0;border-inline:0}
.fspins{display:flex;gap:6px;overflow-x:auto;padding:8px 12px;scrollbar-width:none}
.fspins button{flex:0 0 auto;display:inline-flex;align-items:center;gap:6px;border:0;background:var(--fill);border-radius:9999px;padding:4px 12px 4px 4px;font-size:13px;font-weight:600;cursor:pointer}
.fspins .pin{position:static;transform:none;width:24px;height:24px;font-size:12px;border-width:2px;box-shadow:none}
.pin{position:absolute;transform:translate(-50%,-50%);width:30px;height:30px;border-radius:50%;border:3px solid var(--pin-ring);display:grid;place-items:center;font:700 14px/1 var(--f-mono);color:var(--on-color);box-shadow:0 2px 6px rgba(0,0,0,.35);cursor:pointer;padding:0}
.pin.sel{width:38px;height:38px;font-size:16px;z-index:2;box-shadow:0 0 0 5px rgba(255,255,255,.65),0 2px 8px rgba(0,0,0,.45)}
.pin .lbl{position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);white-space:nowrap;background:var(--label-bg);color:var(--on-color);font:600 13px/1.3 var(--f-body);padding:4px 8px;border-radius:8px}
.k-stage{background:var(--k-stage)}.k-meet{background:var(--k-meet)}.k-aid{background:var(--k-aid)}.k-info{background:var(--k-info)}.k-teacher{background:var(--k-teacher)}.k-etc{background:var(--k-etc)}
.legend li{border-top:1px solid var(--line)}
.legend li:first-child{border-top:0}
.legend button{all:unset;box-sizing:border-box;width:100%;display:grid;grid-template-columns:30px 1fr auto;gap:12px;align-items:center;padding:10px 16px;cursor:pointer;font-weight:600}
.legend button:focus-visible{outline:2px solid var(--action);outline-offset:-2px}
.legend .pin{position:static;transform:none;width:28px;height:28px;font-size:13px;box-shadow:none;border-width:2px}
.legend small{color:var(--muted);font-size:13px;font-weight:400}
.mapempty{padding:28px 20px;display:grid;gap:8px;text-align:center;color:var(--muted)}
.netchip{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.netchip i{width:8px;height:8px;border-radius:50%;background:var(--ok)}
.netchip.off i{background:var(--danger)}

/* 수정·로그인 */
.editor{display:grid;gap:18px}
.field{display:grid;gap:4px;min-width:0}
.field label{font-size:13px;font-weight:600;color:var(--muted)}
.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);background:var(--subtle);border-radius:8px;padding:8px 12px;min-width:0}
.field textarea{min-height:150px;line-height:1.5;resize:vertical}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.erows{display:grid;gap:10px}
.erow{border:1px solid var(--line);border-radius:8px;padding:10px;display:grid;gap:8px;background:var(--subtle)}
.erow .ops{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:13px;color:var(--muted)}
.erow .ops .sp{flex:1}
.eprog{grid-template-columns:130px 1fr}
.ecr{grid-template-columns:1fr 1fr 1fr auto}
.epin{grid-template-columns:1fr 130px}
@media (max-width:520px){.eprog{grid-template-columns:1fr}.ecr,.epin{grid-template-columns:1fr 1fr}}
.savebar{position:sticky;bottom:0;background:var(--bg);padding-block:12px calc(12px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;flex-wrap:wrap;align-items:center;border-top:1px solid var(--line)}
.savebar .msg{flex:1 1 200px;font-size:14px;color:var(--muted)}
.login{max-width:420px;width:100%;margin:0 auto}
.login form{display:grid;gap:12px}
.err{color:var(--danger-ink);font-size:14px;margin:0}
.toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + 16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:14px;max-width:calc(100% - 32px);z-index:40}
footer{color:var(--muted);font-size:12px;text-align:center}
</style>
</head>

<div id="app"></div>

<!-- 기본 데이터: data.json을 아직 못 받았을 때(첫 접속 직후, 통신 불량) 이 내용이 바로 보여요 -->
<script id="state" type="application/json">{
"school":"금정중학교",
"title":"한우물제",
"date":"2026-10-28",
"venue":"서울랜드 이벤트홀",
"start":"09:30",
"morningTime":"08:50",
"morningPlace":"서울랜드 정문",
"meetTime":"16:00",
"meetPlace":"서울랜드 정문 앞 (확정되면 수정)",
"homeNote":"반별 인원 확인이 끝나면 담임 선생님 안내에 따라 귀가",

function valid(d){return !!(d&&typeof d==='object'&&Array.isArray(d.program)&&typeof d.start==='string'&&/^\d{1,2}:\d{2}$/.test(d.start)&&typeof d.meetTime==='string')}
function merge(d){var o=JSON.parse(JSON.stringify(DEFAULT));for(var k in d)if(d[k]!=null)o[k]=d[k];o.program=o.program.map(function(p){return{type:p.type,title:p.title}});return o}

function m(t){var p=String(t||'0:0').split(':');return(+p[0]||0)*60+(+p[1]||0)}
function hm(n){n=Math.round(n);return String(Math.floor(n/60)%24).padStart(2,'0')+':'+String(n%60).padStart(2,'0')}
function dur(n){n=Math.max(0,Math.round(n));var h=Math.floor(n/60),mm=n%60;return(h?h+'시간 ':'')+(mm||!h?mm+'분':'')}
function kind(t){t=t||'';if(t.indexOf('영상')>-1)return'video';if(t.indexOf('공연')>-1)return'perf';return'cer'}
function ymd(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function fmtDate(s){var d=new Date(s+'T00:00:00');if(isNaN(d))return s;return d.getFullYear()+'. '+(d.getMonth()+1)+'. '+d.getDate()+'.('+'일월화수목금토'[d.getDay()]+')'}
/* 받침에 맞춰 '로/으로' (받침 없거나 ㄹ이면 '로') */
function ro(s){var c=String(s).trim().charCodeAt(String(s).trim().length-1)-0xAC00;if(!(c>=0&&c<11172))return'로';var j=c%28;return(j===0||j===8)?'로':'으로'}
function nowMin(){var d=new Date();return d.getHours()*60+d.getMinutes()+d.getSeconds()/60}

/* 공연 진행은 늦어질 수 있어 순서별 시각은 쓰지 않고, 고정된 시작·집결 시각만 기준으로 삼아요 */
function status(){
  var td=ymd(new Date()),meet=m(S.meetTime);
  if(td<S.date){var days=Math.round((new Date(S.date+'T00:00:00')-new Date(td+'T00:00:00'))/864e5);return{phase:'before',days:days}}
  if(td>S.date)return{phase:'after'};
  var n=nowMin();
  if(n<m(S.start))return{phase:'pre',left:m(S.start)-n,n:n};
  if(n<meet)return{phase:'day',left:meet-n,n:n};
  if(n<meet+40)return{phase:'meet',n:n};
  return{phase:'home',n:n};
}

/* 지도 높이를 꽉 채우는 배율 (가로로 긴 지도라 휴대폰에서는 약 2배) */
function fitZoom(){var b=document.getElementById('mapbox');if(!b||!b.clientWidth)return 1;
  var h=mapFull?b.clientHeight:parseFloat(getComputedStyle(b).maxHeight);if(!(h>0))h=window.innerHeight*.7;
  return Math.max(1,Math.min(maxZ(),h/(b.clientWidth*MAP_H/MAP_W)))}
function zoomUI(){var l=document.getElementById('zoomlbl');if(l)l.textContent=Math.round(zoom*100)+'%';
  var bs=app.querySelectorAll('[data-zoom]');for(var i=0;i<bs.length;i++)bs[i].disabled=(+bs[i].dataset.zoom<0)?zoom<=1.001:zoom>=maxZ()-.001}
/* 화면 속 한 점(cx,cy: 지도 상자 기준)을 그대로 두고 배율만 바꿈 → 다시 그리지 않아서 손가락 확대가 부드러움 */
function setZoom(z,cx,cy){var box=document.getElementById('mapbox'),inner=document.getElementById('mapinner');if(!box||!inner)return;
  z=Math.max(1,Math.min(maxZ(),z));if(cx==null){cx=box.clientWidth/2;cy=box.clientHeight/2}
  var fx=(box.scrollLeft+cx)/inner.offsetWidth,fy=(box.scrollTop+cy)/inner.offsetHeight;
  zoom=z;inner.style.setProperty('--z',z);box.scrollLeft=fx*inner.offsetWidth-cx;box.scrollTop=fy*inner.offsetHeight-cy;zoomUI()}
function centerOn(x,y,smooth){var box=document.getElementById('mapbox'),inner=document.getElementById('mapinner');if(!box||!inner)return;
  var o={left:inner.offsetWidth*x/100-box.clientWidth/2,top:inner.offsetHeight*y/100-box.clientHeight/2};if(smooth)o.behavior='smooth';box.scrollTo(o)}
function scrollToPin(i){var p=(mode==='edit'?draft:S).pins[i];if(p&&p.x!=null)centerOn(p.x,p.y,true)}

    {t:hm(meet-10),a:'집결 장소로 이동',b:'놀이기구 줄은 이 시간 전에 마무리해요',at:meet-10},

function render(){
  /* 다시 그려도 지도 보던 위치가 튀지 않게 유지 */
  var ob=zoom!=null&&document.getElementById('mapbox'),sl=ob?ob.scrollLeft:0,st=ob?ob.scrollTop:0;
  try{renderInner();var nb=document.getElementById('mapbox');if(ob&&nb){nb.scrollLeft=sl;nb.scrollTop=st}
    document.documentElement.style.overflow=(mapFull&&nb)?'hidden':''}catch(e){
    /* 데이터가 꼬여도 화면이 하얗게 멈추지 않도록 기본 안내로 되돌림 */
    if(S!==DEFAULT){S=DEFAULT;try{renderInner()}catch(e2){app.textContent='안내를 불러오지 못했어요. 새로고침해 주세요.'}}
    else app.textContent='안내를 불러오지 못했어요. 새로고침해 주세요.';
  }
}

var drag=null,pinch=null,noClick=false;
function wireMap(){
  var img=document.getElementById('mapimg'),box=document.getElementById('mapbox');if(!img||!box)return;
  /* 한 번 실패하면 주소를 바꿔 한 번 더 받아 보고, 그래도 안 되면 안내 + 다시 불러오기 버튼 */
  if(mapOk===null){img.addEventListener('error',function(){if(!img.dataset.retry){img.dataset.retry='1';img.src=MAP_IMAGE+'&r='+Date.now();return}mapOk=false;render()});img.addEventListener('load',function(){mapOk=true})}
  /* 처음 열 때: 높이에 꽉 차게 확대하고 선택한 곳(없으면 공연장)을 가운데로 */
  if(zoom==null){
    var pins=(mode==='edit'?draft:S).pins,c=pins[selPin];
    if(!c||c.x==null)c=pins.filter(function(p){return p.kind==='stage'&&p.x!=null})[0];
    setZoom(fitZoom());if(c)centerOn(c.x,c.y);else centerOn(50,50);
  }else zoomUI();
  /* 두 손가락 확대·축소 */
  function two(e){var a=e.touches[0],b=e.touches[1],r=box.getBoundingClientRect();return{d:Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY),x:(a.clientX+b.clientX)/2-r.left,y:(a.clientY+b.clientY)/2-r.top}}
  box.addEventListener('touchstart',function(e){if(e.touches.length===2){var t=two(e);pinch={d:t.d,z:zoom,x:t.x,y:t.y};e.preventDefault()}},{passive:false});
  box.addEventListener('touchmove',function(e){if(!pinch||e.touches.length!==2)return;e.preventDefault();var t=two(e);
    box.scrollLeft-=t.x-pinch.x;box.scrollTop-=t.y-pinch.y;pinch.x=t.x;pinch.y=t.y;setZoom(pinch.z*t.d/pinch.d,t.x,t.y)},{passive:false});
  box.addEventListener('touchend',function(e){if(e.touches.length<2&&pinch){pinch=null;noClick=true;setTimeout(function(){noClick=false},350)}});
  box.addEventListener('gesturestart',function(e){e.preventDefault()});
  /* 컴퓨터: Ctrl+휠(노트북 터치패드 확대)로 확대, 마우스로 끌어서 이동 */
  box.addEventListener('wheel',function(e){if(!e.ctrlKey)return;e.preventDefault();var r=box.getBoundingClientRect();setZoom(zoom*Math.exp(-e.deltaY*.01),e.clientX-r.left,e.clientY-r.top)},{passive:false});
  box.addEventListener('pointerdown',function(e){if(e.pointerType!=='mouse'||e.button!==0)return;drag={x:e.clientX,y:e.clientY,sl:box.scrollLeft,st:box.scrollTop,moved:false}});
  box.addEventListener('pointermove',function(e){if(!drag)return;var dx=e.clientX-drag.x,dy=e.clientY-drag.y;
    if(!drag.moved&&Math.abs(dx)+Math.abs(dy)>5){drag.moved=true;box.classList.add('dragging')}
    if(drag.moved){box.scrollLeft=drag.sl-dx;box.scrollTop=drag.st-dy}});
  function up(){if(drag&&drag.moved){noClick=true;setTimeout(function(){noClick=false},0)}drag=null;box.classList.remove('dragging')}
  box.addEventListener('pointerup',up);box.addEventListener('pointerleave',up);
}

  wireMap();

/* 공지 보내기 (관리자). 저장 버튼과 별개로 바로 전송 */
var ANN_PRESETS=['08:50까지 서울랜드 정문으로 모여 주세요.','이제 공연을 시작합니다. 무대에 집중해 주세요.','잠시 후 다음 순서가 시작돼요. 자리로 돌아와 주세요.','공연이 끝났어요. 선생님 안내에 따라 천천히 퇴장해요.','16:00까지 집결 장소로 모여 주세요.'];
var annDraft={text:'',minutes:10},annMsg='',annBusy=false;
function annCard(){
  var cur=annActive()?'<p class="callout">지금 떠 있는 공지: <b>'+esc(ann.text)+'</b> ('+Math.max(1,Math.ceil((new Date(ann.until)-Date.now())/60000))+'분 남음)</p>':'';
  var pre=ANN_PRESETS.map(function(t,i){return'<button class="btn small" data-annpre="'+i+'">'+esc(t)+'</button>'}).join('');
  var mins=[5,10,30].map(function(n){return'<button class="chipbtn" data-annmin="'+n+'" aria-pressed="'+(annDraft.minutes===n)+'">'+n+'분</button>'}).join('');
  return'<div class="card"><h3>학생 화면에 공지 띄우기</h3><p class="callout">보내면 학생 화면에 큰 글씨로 떠요. 학생이 화면을 누르면 닫혀요. 아래 "저장"과 상관없이 바로 보내지고, 학생 화면에는 1~2분 안에 떠요.</p>'+cur+
   '<div class="field"><label for="ann-text">공지 내용 (200자까지)</label><textarea id="ann-text" data-ann="1" maxlength="200" style="min-height:90px">'+esc(annDraft.text)+'</textarea></div>'+
   '<div class="field"><label>자주 쓰는 문구 (누르면 채워져요)</label><div class="presets">'+pre+'</div></div>'+
   '<div class="field"><label>띄워 둘 시간</label><div class="filters" role="group" aria-label="띄워 둘 시간">'+mins+'</div></div>'+
   '<div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn primary" data-act="annsend"'+(annBusy?' disabled':'')+'>공지 보내기</button>'+(annActive()?'<button class="btn" data-act="annoff"'+(annBusy?' disabled':'')+'>공지 내리기</button>':'')+'</div>'+
   (annMsg?'<p class="callout" role="status">'+esc(annMsg)+'</p>':'')+'</div>';
}
function annDone(r,okMsg){annBusy=false;annMsg=r.ok?okMsg:errText(r.error);if(mode==='edit')render()}
function sendAnn(){
  var t=annDraft.text.trim();if(annBusy)return;
  if(!t){annMsg='공지 내용을 적어 주세요.';render();return}
  annBusy=true;annMsg='보내는 중…';render();
  api({action:'announce',password:adminPw,text:t,minutes:annDraft.minutes}).then(function(r){
    if(r.ok&&r.announce&&r.announce.text){ann=r.announce;annClosed=ann.id;try{localStorage.setItem(LSANN,annClosed)}catch(e){}} // 보낸 선생님 화면에는 큰 공지를 다시 띄우지 않음
    annDone(r,'보냈어요. 1~2분 안에 학생 화면에 떠요.');
  }).catch(function(){annDone({ok:false,error:'network'},'')});
}
function offAnn(){
  if(annBusy)return;annBusy=true;annMsg='내리는 중…';render();
  api({action:'unannounce',password:adminPw}).then(function(r){if(r.ok)ann=null;annDone(r,'내렸어요. 1~2분 안에 학생 화면에서 사라져요.')}).catch(function(){annDone({ok:false,error:'network'},'')});
}
function setMsg(t){var e=document.getElementById('savemsg');if(e)e.textContent=t}
function toast(t){var e=document.createElement('div');e.className='toast';e.setAttribute('role','status');e.textContent=t;document.body.appendChild(e);setTimeout(function(){e.remove()},3800)}
function validate(d){
  if(!/^\d{2}:\d{2}$/.test(d.start))return'공연 시작 시각을 확인해 주세요.';
  if(!/^\d{2}:\d{2}$/.test(d.meetTime))return'집결 시각을 확인해 주세요.';
  if(d.morningTime&&!/^\d{2}:\d{2}$/.test(d.morningTime))return'아침 집결 시각을 확인해 주세요.';
  if(!/^\d{4}-\d{2}-\d{2}$/.test(d.date))return'행사 날짜를 확인해 주세요.';
  for(var i=0;i<d.program.length;i++){var p=d.program[i];if(!String(p.title).trim())return(i+1)+'번 순서의 내용이 비어 있어요.'}
  return null;
}
function save(){
  var err=validate(draft);if(err){setMsg(err);return}
  busy=true;setMsg('저장 중…');
  api({action:'save',password:adminPw,data:draft}).then(function(r){busy=false;
    if(!r.ok){setMsg(errText(r.error));return}
    S=merge(draft);updatedAt=r.updated||new Date().toISOString();
    try{localStorage.setItem(CACHE,JSON.stringify({data:S,updated:updatedAt}))}catch(e){}
    mode='view';draft=null;placing=-1;mapFull=false;render();toast('저장했어요. 약 1~4분 뒤 모든 학생 화면에 반영돼요.');
  }).catch(function(){busy=false;setMsg('인터넷 연결을 확인하고 다시 저장해 주세요.')});
}

/* ---------- 공지: announce.json(작은 파일)을 1분마다 확인 ---------- */
var ann=null,annClosed='',annBarOn=false,annLoading=false,LSANN='hanumul2026-ann-closed';
try{annClosed=localStorage.getItem(LSANN)||''}catch(e){}
function annActive(){return !!(ann&&ann.text&&Date.now()<new Date(ann.until).getTime())}
function annTime(){var d=new Date(ann.at);return isNaN(d)?'':hm(d.getHours()*60+d.getMinutes())+' 선생님 공지'}
function hideAnn(){var o=document.getElementById('annov');if(o)o.remove()}
function showAnn(buzz){
  hideAnn();if(!annActive())return;
  var o=document.createElement('div');o.className='ann';o.id='annov';o.dataset.id=ann.id;o.tabIndex=-1;o.setAttribute('role','alertdialog');o.setAttribute('aria-modal','true');o.setAttribute('aria-label','선생님 공지');
  o.innerHTML='<div class="ann-card"><span class="tag">📢 공지</span><p class="ann-text">'+esc(ann.text)+'</p><span class="ann-time">'+esc(annTime())+'</span><span class="ann-hint">화면을 누르면 닫혀요</span></div>';
  o.addEventListener('click',function(){annClosed=ann?ann.id:'';try{localStorage.setItem(LSANN,annClosed)}catch(e){}hideAnn();if(mode==='view')render()});
  document.body.appendChild(o);o.focus();
  if(buzz){try{if(navigator.vibrate&&(!navigator.userActivation||navigator.userActivation.hasBeenActive))navigator.vibrate([200,100,200])}catch(e){}} // 화면을 한 번이라도 눌렀을 때만 진동 (그 전에는 브라우저가 막음)
}
function applyAnn(){
  var ov=document.getElementById('annov');
  if(!annActive()){hideAnn();if(mode==='view'&&annBarOn)render();return}
  if(mode!=='view')return;
  if(ann.id!==annClosed){if(!ov||ov.dataset.id!==ann.id)showAnn(true);if(annBarOn)render()}
  else{if(ov)hideAnn();if(!annBarOn)render()}
}
/* ---------- 아침 집결 팝업: 행사 당일 아침 집결 시각(08:50)이 지나면 더 이상 뜨지 않음 ----------
 * 행사 전날까지는 하루 한 번, 행사 당일에는 열 때마다 띄움. 선생님 공지가 떠 있으면 공지가 먼저 */
var LSMORN='hanumul2026-morn-seen';
function mornEnd(){var mt=S.morningTime||'';if(!/^\d{1,2}:\d{2}$/.test(mt))return 0;var d=new Date(S.date+'T'+(mt.length<5?'0'+mt:mt)+':00');return isNaN(d)?0:d.getTime()}
function mornActive(){var e=mornEnd();return e>0&&Date.now()<e}
function hideMorn(){var o=document.getElementById('mornov');if(o)o.remove()}
function showMorn(){
  if(mode!=='view'||!mornActive()||document.getElementById('annov')||document.getElementById('mornov'))return;
  var td=ymd(new Date()),today=td===S.date;
  if(!today){var seen='';try{seen=localStorage.getItem(LSMORN)||''}catch(e){}if(seen===td)return}
  var mt=S.morningTime,mp=S.morningPlace||'집결 장소',d=new Date(S.date+'T00:00:00');
  var when=today?'오늘':(d.getMonth()+1)+'월 '+d.getDate()+'일('+'일월화수목금토'[d.getDay()]+')';
  var left=today?'<span class="ann-time">'+dur((mornEnd()-Date.now())/60000)+' 남았어요</span>':'';
  var o=document.createElement('div');o.className='ann';o.id='mornov';o.tabIndex=-1;o.setAttribute('role','alertdialog');o.setAttribute('aria-modal','true');o.setAttribute('aria-label','아침 집결 안내');
  o.innerHTML='<div class="ann-card"><span class="tag">🚩 아침 집결</span><p class="ann-text">'+esc(when)+' <span class="mono">'+esc(mt)+'</span>까지<br>'+esc(mp)+ro(mp)+'<br>모여요</p>'+left+
   '<span class="ann-hint" style="color:var(--ink)">늦을 것 같으면 담임 선생님께 미리 연락해요</span><span class="ann-hint">화면을 누르면 닫혀요</span></div>';
  o.addEventListener('click',function(){try{localStorage.setItem(LSMORN,ymd(new Date()))}catch(e){}hideMorn()});
  document.body.appendChild(o);o.focus();
}
function loadAnn(){
  if(annLoading)return;annLoading=true;
  var ctl=window.AbortController?new AbortController():null,timer=setTimeout(function(){if(ctl)ctl.abort()},8000);
  fetch('announce.json',{cache:'no-cache',signal:ctl?ctl.signal:undefined}).then(function(r){if(!r.ok)throw new Error(r.status);return r.json()}).then(function(j){
    clearTimeout(timer);annLoading=false;
    ann=(j&&typeof j==='object'&&typeof j.text==='string'&&j.text.trim())?{id:String(j.id||''),text:j.text.trim().slice(0,200),at:String(j.at||''),until:String(j.until||'')}:null;
    applyAnn();
  }).catch(function(){clearTimeout(timer);annLoading=false}); // 실패하면 조용히 넘어가고 다음 확인 때 다시
}

/* ---------- data sync ---------- */
var loading=false;
function load(){
  if(loading)return;loading=true;
  var ctl=window.AbortController?new AbortController():null,timer=setTimeout(function(){if(ctl)ctl.abort()},8000);
  fetch(DATA_URL,{cache:'no-cache',signal:ctl?ctl.signal:undefined}).then(function(r){if(!r.ok)throw new Error(r.status);var fromCache=r.headers.get('X-From-Cache')==='1';return r.json().then(function(j){return{j:j,c:fromCache}})}).then(function(x){
    var r=x.j;clearTimeout(timer);loading=false;var wasOn=online;
    online=!x.c;if(online)lastSync=Date.now(); // 서비스 워커가 저장본을 준 경우는 오프라인으로 표시
    var changed=r&&valid(r.data)&&String(r.updated||'')>String(updatedAt||'');
    if(changed){S=merge(r.data);updatedAt=r.updated;try{localStorage.setItem(CACHE,JSON.stringify({data:S,updated:updatedAt}))}catch(e){}}
    if(mode==='view'&&(changed||wasOn!==online||tab!=='map'))render();
  }).catch(function(){clearTimeout(timer);loading=false;if(online){online=false;if(mode==='view'&&tab!=='map')render()}});
}

/* ---------- events ---------- */
app.addEventListener('click',function(ev){
  var inner=ev.target.closest('#mapinner');
  if(noClick&&ev.target.closest('#mapbox'))return; // 지도를 끌거나 확대한 직후의 눌림은 무시
  if(inner&&mode==='edit'&&placing>-1&&!ev.target.closest('.pin')){
    var r=inner.getBoundingClientRect();draft.pins[placing].x=+((ev.clientX-r.left)/r.width*100).toFixed(2);draft.pins[placing].y=+((ev.clientY-r.top)/r.height*100).toFixed(2);
    placing=-1;render();return}
  var b=ev.target.closest('button');if(!b)return;
  if(b.dataset.tab){tab=b.dataset.tab;try{history.replaceState(null,'','#'+tab)}catch(e){}render();window.scrollTo({top:0});return}
  if(b.dataset.filter){filter=b.dataset.filter;render();return}
  if(b.dataset.zoom){setZoom(zoom*(+b.dataset.zoom>0?1.5:1/1.5));return}
  if(b.dataset.pin!=null&&mode==='view'){var i=+b.dataset.pin;selPin=(selPin===i&&b.classList.contains('pin'))?-1:i;var y2=window.scrollY;render();window.scrollTo(0,y2);
    if(selPin>-1){if(zoom<3)setZoom(3);scrollToPin(selPin);var mb=document.getElementById('mapbox');
      if(mb&&!mapFull){var rr=mb.getBoundingClientRect();if(rr.top<0||rr.bottom>window.innerHeight)mb.scrollIntoView({behavior:'smooth',block:'center'})}}return}
  if(b.dataset.gopin!=null){tab='map';selPin=+b.dataset.gopin;zoom=null;mapFull=true;try{history.replaceState(null,'','#map')}catch(e){}render();if(zoom<3)setZoom(3);scrollToPin(selPin);return}
  if(b.dataset.copy!=null){var t=b.dataset.copy,ok=function(){b.textContent='복사됨';setTimeout(function(){b.textContent='복사'},1500)};
    if(navigator.clipboard)navigator.clipboard.writeText(t).then(ok,function(){});return}
  var a=b.dataset.act;
  if(a==='annopen'){showAnn(false);return}
  if(a==='annsend'){sendAnn();return}
  if(a==='annoff'){offAnn();return}
  if(b.dataset.annpre!=null){annDraft.text=ANN_PRESETS[+b.dataset.annpre];render();return}
  if(b.dataset.annmin!=null){annDraft.minutes=+b.dataset.annmin;render();return}
  if(a==='mapretry'){mapOk=null;zoom=null;render();return}
  if(a==='mapfull'){mapFull=!mapFull;zoom=null;var yf=window.scrollY;render();if(!mapFull)window.scrollTo(0,yf);return}
  if(a==='login'||a==='cancel')mapFull=false;
  if(a==='login'){loginErr='';mode=adminPw?'edit':'login';if(mode==='edit'){draft=JSON.parse(JSON.stringify(S))}render();window.scrollTo({top:0});return}
  if(a==='cancel'){mode='view';draft=null;placing=-1;loginErr='';render();load();return}
  if(a==='save'){save();return}
  if(a==='cadd'){draft.contacts.push({role:'',name:'',phone:''});render();return}
  if(a==='madd'){draft.pins.push({label:'',kind:'etc',x:null,y:null});render();return}
  if(b.dataset.mv!=null){var k=+b.dataset.mv,j=k+(+b.dataset.d),P=draft.program,x=P[k];P[k]=P[j];P[j]=x;render();return}
  if(b.dataset.ins!=null){draft.program.splice(+b.dataset.ins,0,{type:'개인공연',title:''});render();var el=document.getElementById('p'+b.dataset.ins+'-title');if(el)el.focus();return}
  if(b.dataset.del!=null){draft.program.splice(+b.dataset.del,1);render();return}
  if(b.dataset.cdel!=null){draft.contacts.splice(+b.dataset.cdel,1);render();return}
  if(b.dataset.mdel!=null){draft.pins.splice(+b.dataset.mdel,1);placing=-1;render();return}
  if(b.dataset.place!=null){var pi=+b.dataset.place;placing=(placing===pi)?-1:pi;render();if(placing>-1){var mb2=document.getElementById('mapbox');if(mb2)mb2.scrollIntoView({behavior:'smooth',block:'center'})}return}
  if(b.dataset.unplace!=null){var u=draft.pins[+b.dataset.unplace];u.x=null;u.y=null;render();return}
});
document.addEventListener('keydown',function(ev){if(ev.key==='Escape'&&mapFull){mapFull=false;zoom=null;render()}});
app.addEventListener('submit',function(ev){
  if(ev.target.id!=='loginform')return;ev.preventDefault();
  var pw=document.getElementById('pw').value;busy=true;loginErr='';render();
  api({action:'check',password:pw}).then(function(r){busy=false;
    if(r.ok){adminPw=pw;draft=JSON.parse(JSON.stringify(S));mode='edit'}else loginErr=errText(r.error);render();
  }).catch(function(){busy=false;loginErr='서버에 연결하지 못했어요. 인터넷 연결을 확인해 주세요.';render()});
});
app.addEventListener('input',function(ev){
  var e=ev.target;if(!draft)return;
  if(e.dataset.ann!=null)annDraft.text=e.value;
  else if(e.dataset.p!=null){var p=draft.program[+e.dataset.p];p[e.dataset.k]=e.value}
  else if(e.dataset.c!=null)draft.contacts[+e.dataset.c][e.dataset.k]=e.value;
  else if(e.dataset.m!=null)draft.pins[+e.dataset.m][e.dataset.k]=e.value;
  else if(e.dataset.s){draft[e.dataset.s]=e.value}
  else if(e.dataset.l)draft[e.dataset.l]=e.value.split('\n').map(function(s){return s.trim()}).filter(Boolean);
});
app.addEventListener('change',function(ev){var e=ev.target;
  if(e.dataset.chk!=null){checks[e.dataset.chk]=e.checked;try{localStorage.setItem(LSCHK,JSON.stringify(checks))}catch(x){}}
  if(e.dataset.m!=null&&e.dataset.k==='kind'&&draft)render();});

render();
showMorn();
/* 350명이 같은 순간에 요청하지 않도록 첫 확인과 주기 확인을 사람마다 조금씩 어긋나게 */
setTimeout(load,Math.random()*1500);
setTimeout(loadAnn,300+Math.random()*1500);
setInterval(function(){if(mode==='view'&&tab!=='map'&&!document.hidden)render();applyAnn();if(!mornActive())hideMorn()},30000);
/* 공지는 아주 작은 파일이라 1분(±25%)마다 확인. 화면이 꺼져 있으면 건너뜀 */
(function pollA(){setTimeout(function(){if(!document.hidden)loadAnn();pollA()},ANN_MS*(0.75+Math.random()*0.5))})();
(function poll(){setTimeout(function(){if(!document.hidden)load();poll()},POLL_MS*(0.75+Math.random()*0.5))})();
var lastVis=0;
document.addEventListener('visibilitychange',function(){if(!document.hidden){loadAnn();if(Date.now()-lastVis>30000){lastVis=Date.now();load()}}});
window.addEventListener('online',function(){load();loadAnn()});
window.addEventListener('offline',function(){online=false;if(mode==='view'&&tab!=='map')render()});
/* 오프라인 저장: 한 번 열면 다음부터는 통신이 안 돼도 열려요 */
if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost')){
  window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})});
}
})();
</script>
